name: Sync Players

# Names every player who has been through the league, and writes a trimmed
# list of every NFL player to the Worker's PLAYERS KV namespace (see
# worker/scripts/sync-players.ts). Sleeper's full player list is too big for
# the Worker to parse within the free plan's 10 ms of CPU, so it runs here.
on:
  schedule:
    # Tuesdays 13:00 UTC, two hours after the Worker's recap cron has stored
    # the week's transactions. GitHub numbers weekdays Unix-style (2=Tuesday),
    # unlike Cloudflare's Quartz-style crons in wrangler.jsonc.
    - cron: "0 13 * * 2"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync players
        run: npm run sync-players
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # The same token the deploy uses; the KV step is skipped if any of
          # these three is unset.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLAYERS_KV_NAMESPACE_ID: ${{ secrets.PLAYERS_KV_NAMESPACE_ID }}
